# Dev infrastructure — DB + Redis + Traefik (+ Adminer).
#
# App processes run on the host with hot reload (fast-rio-ctrl.bat dev run all):
#   uvicorn --reload on :18000 (host 8000 is often Hyper-V-excluded on Windows)
#   arq app.worker.worker.WorkerSettings  (full runtime — requires Redis)
#   rio run on :3000
#
# Slim runtime (no Redis / no worker):
#   fast-rio-ctrl.bat dev run all --slim
#
# Traefik routes (file provider → host.docker.internal):
#   http://api.localhost        → localhost:18000
#   http://dashboard.localhost  → localhost:3000
#   http://adminer.localhost    → adminer container
# Adminer login: server `db`, port 5432, credentials from .env (not localhost:15432). See Readme.md.
# Traefik dashboard: http://localhost:18090
# Host Redis: :16379 (host 6379 is often Hyper-V-excluded on Windows)

name: fast-rio-dev

x-backend-image: &backend-image
  image: fast-rio-backend-dev:dev

x-dev-env: &dev-env
  env_file:
    - .env

x-dev-app-config: &dev-app-config
  DOMAIN: localhost
  ENVIRONMENT: local
  PROJECT_NAME: fast-rio
  FRONTEND_HOST: http://dashboard.localhost
  BACKEND_CORS_ORIGINS: http://localhost,http://localhost:3000,http://localhost:18000,http://api.localhost,http://dashboard.localhost,http://adminer.localhost
  REDIS_HOST: host.docker.internal
  REDIS_PORT: "16379"
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

services:
  redis:
    <<: *dev-env
    image: redis:8-alpine
    restart: "no"
    ports:
      - "16379:6379"
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --save 60 1 --loglevel warning
        fi
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:18
    restart: "no"
    <<: *dev-env
    ports:
      - "15432:5432"
    volumes:
      # postgres:18 VOLUME is /var/lib/postgresql (not .../data); default PGDATA is .../18/docker.
      # Mount the named volume at /var/lib/postgresql or Docker creates an empty anonymous volume.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: "no"
    depends_on:
      - db
    environment:
      ADMINER_DESIGN: pepa-linha-dark
    networks:
      - traefik-public
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.fast-rio-adminer.loadbalancer.server.port=8080
      - traefik.http.routers.fast-rio-adminer-http.rule=Host(`adminer.localhost`)
      - traefik.http.routers.fast-rio-adminer-http.entrypoints=http
      - traefik.http.routers.fast-rio-adminer-http.middlewares=https-redirect
      - traefik.http.routers.fast-rio-adminer-https.rule=Host(`adminer.localhost`)
      - traefik.http.routers.fast-rio-adminer-https.entrypoints=https
      - traefik.http.routers.fast-rio-adminer-https.tls=true

  proxy:
    image: traefik:3.6
    restart: "no"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "80:80"
      - "443:443"
      - "18090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.dev.yml:/etc/traefik/dynamic.dev.yml:ro
    command:
      - --providers.docker
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-public
      - --providers.file.filename=/etc/traefik/dynamic.dev.yml
      - --providers.file.watch=true
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --accesslog
      - --log
      - --log.level=INFO
      - --api
      - --api.insecure=true
    labels:
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default

  prestart:
    <<: [*dev-env, *backend-image]
    profiles:
      - tools
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: bash scripts/prestart.sh
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
    environment:
      <<: *dev-app-config
      SECRET_KEY: ${SECRET_KEY?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      SENTRY_DSN: ${SENTRY_DSN}

volumes:
  db-data:
  redis-data:

networks:
  traefik-public:
    name: traefik-public
